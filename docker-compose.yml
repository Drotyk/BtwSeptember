services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: btw_september
      POSTGRES_USER: btw_user
      POSTGRES_PASSWORD: btw_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btw_user -d btw_september"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://btw_user:btw_password@postgres:5432/btw_september
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
