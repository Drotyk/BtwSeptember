<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTW — вхід</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1f1f1;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid #cfcfcf;
        background: #fff;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        color: #666;
      }
      label {
        display: block;
        margin: 16px 0 6px;
      }
      input,
      button {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid #999;
        border-radius: 4px;
        font: inherit;
      }
      button {
        margin-top: 20px;
        cursor: pointer;
        background: #111;
        color: #fff;
      }
      .error {
        margin-top: 16px;
        color: #9b1c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BTW</h1>
      <p>Вхід до адміністративної панелі</p>
      <form id="login-form">
        <label for="username">Логін</label
        ><input id="username" name="username" autocomplete="username" required />
        <label for="password">Пароль</label
        ><input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Увійти</button>
        <div id="error" class="error" hidden>Неправильний логін або пароль.</div>
      </form>
      <script src="/login.js" defer></script>
    </main>
  </body>
</html>
