<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTW — анкети</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f1f1f1;
        --surface: #fff;
        --text: #111;
        --muted: #666;
        --border: #cfcfcf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.4;
      }
      main {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      .subtitle {
        margin: 8px 0 28px;
        color: var(--muted);
      }
      .toolbar,
      .table-wrap,
      .footer {
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .toolbar {
        display: flex;
        gap: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      input,
      button {
        min-height: 40px;
        border: 1px solid #999;
        border-radius: 4px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }
      input {
        width: min(500px, 100%);
        padding: 0 12px;
      }
      button {
        padding: 0 16px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--text);
        color: var(--surface);
      }
      button:disabled {
        color: var(--muted);
        cursor: default;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1600px;
      }
      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        white-space: nowrap;
      }
      td.trainings {
        max-width: 460px;
        white-space: pre-line;
      }
      th {
        background: #e7e7e7;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .empty,
      .error {
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
        border-top: 0;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
      }
      .pagination {
        display: flex;
        gap: 8px;
      }
      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 1440px);
          padding: 24px 0;
        }
        .toolbar {
          flex-direction: column;
        }
        input {
          width: 100%;
        }
        header {
          flex-direction: column;
        }
        .footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Анкети BTW</h1>
          <p class="subtitle">Захищений перегляд збережених анкет</p>
        </div>
        <button id="logout" type="button">Вийти</button>
      </header>
      <form class="toolbar" id="search-form">
        <input
          id="search"
          type="search"
          placeholder="Пошук за ПІ, телефоном, username, закладом або тренінгом"
          autocomplete="off"
        />
        <button type="submit">Знайти</button>
      </form>
      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>ПІ</th>
              <th>Телефон</th>
              <th>Telegram</th>
              <th>Заклад</th>
              <th>Курс</th>
              <th>Тренінги</th>
              <th>Джерело</th>
              <th>Персональні дані</th>
              <th>Правила BTW</th>
              <th>Telegram ID</th>
              <th>Створено</th>
              <th>Оновлено</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Даних не знайдено</div>
        <div class="error" id="error" hidden>Не вдалося завантажити дані</div>
      </section>
      <footer class="footer">
        <div class="meta" id="meta">Завантаження...</div>
        <div class="pagination">
          <button id="previous" type="button">Попередня</button
          ><button id="next" type="button">Наступна</button>
        </div>
      </footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
