<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTW September — анкети</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f1f1f1;
        --surface: #ffffff;
        --text: #111111;
        --muted: #666666;
        --border: #cfcfcf;
        --border-strong: #999999;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.4;
      }

      main {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 8px 0 28px;
        color: var(--muted);
      }

      .toolbar,
      .table-wrap,
      .footer {
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .toolbar {
        display: flex;
        gap: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }

      input,
      button {
        min-height: 40px;
        border: 1px solid var(--border-strong);
        border-radius: 0;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      input {
        width: min(420px, 100%);
        padding: 0 12px;
      }

      button {
        padding: 0 16px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--text);
        color: var(--surface);
      }

      button:disabled {
        color: var(--muted);
        cursor: default;
      }

      .table-wrap { overflow-x: auto; }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1500px;
      }

      th,
      td {
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        white-space: nowrap;
      }

      td.trainings {
        max-width: 460px;
        white-space: pre-line;
        line-height: 1.45;
      }

      td.consent {
        font-weight: 700;
      }

      th {
        background: #e7e7e7;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #f7f7f7; }

      .empty,
      .error {
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }

      .error { color: var(--text); }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
        border-top: 0;
      }

      .meta { color: var(--muted); font-size: 14px; }
      .pagination { display: flex; gap: 8px; }

      @media (max-width: 640px) {
        main { width: min(100% - 20px, 1440px); padding: 24px 0; }
        .toolbar { flex-direction: column; }
        input { width: 100%; }
        .footer { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Анкети учасників</h1>
      <p class="subtitle">Перегляд збережених анкет</p>

      <form class="toolbar" id="search-form">
        <input id="search" type="search" placeholder="Пошук за ПІ, телефоном, username, закладом або тренінгом" autocomplete="off" />
        <button type="submit">Знайти</button>
      </form>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>ПІ</th>
              <th>Телефон</th>
              <th>Telegram</th>
              <th>Заклад</th>
              <th>Курс</th>
              <th>Дати тренінгів</th>
              <th>Джерело</th>
              <th>Персональні дані</th>
              <th>Правила BTW’25</th>
              <th>Telegram ID</th>
              <th>Створено</th>
              <th>Оновлено</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Даних не знайдено</div>
        <div class="error" id="error" hidden>Не вдалося завантажити дані</div>
      </section>

      <footer class="footer">
        <div class="meta" id="meta">Завантаження...</div>
        <div class="pagination">
          <button id="previous" type="button">Попередня</button>
          <button id="next" type="button">Наступна</button>
        </div>
      </footer>
    </main>

    <script>
      const state = { page: 1, pageSize: 20, search: "" };
      const searchForm = document.querySelector("#search-form");
      const searchInput = document.querySelector("#search");
      const usersBody = document.querySelector("#users-body");
      const empty = document.querySelector("#empty");
      const error = document.querySelector("#error");
      const meta = document.querySelector("#meta");
      const previous = document.querySelector("#previous");
      const next = document.querySelector("#next");

      function formatDate(value) {
        return new Intl.DateTimeFormat("uk-UA", {
          dateStyle: "short",
          timeStyle: "short"
        }).format(new Date(value));
      }

      function addCell(row, value, className = "") {
        const cell = document.createElement("td");
        if (className) cell.className = className;
        cell.textContent = value == null ? "" : String(value);
        row.append(cell);
      }

      function formatConsent(value) {
        return value ? "Так, погоджуюсь" : "Ні";
      }

      function formatTrainingDates(trainings) {
        return (trainings ?? []).map((training) => training.split(" | ", 1)[0]).join("\n");
      }

      function render(users, pagination) {
        usersBody.replaceChildren();
        empty.hidden = users.length !== 0;

        for (const user of users) {
          const row = document.createElement("tr");
          addCell(row, user.id);
          addCell(row, user.name);
          addCell(row, user.phoneNumber);
          addCell(row, user.telegramUsername);
          addCell(row, user.institution);
          addCell(row, user.course);
          addCell(row, formatTrainingDates(user.trainings), "trainings");
          addCell(row, user.discoverySource);
          addCell(row, formatConsent(user.personalDataConsent), "consent");
          addCell(row, formatConsent(user.eventRulesConsent), "consent");
          addCell(row, user.telegramUserId);
          addCell(row, formatDate(user.createdAt));
          addCell(row, formatDate(user.updatedAt));
          usersBody.append(row);
        }

        meta.textContent = `Записів: ${pagination.total} | Сторінка ${pagination.page} з ${pagination.totalPages}`;
        previous.disabled = pagination.page <= 1;
        next.disabled = pagination.page >= pagination.totalPages;
      }

      async function loadUsers() {
        error.hidden = true;
        meta.textContent = "Завантаження...";
        const params = new URLSearchParams({
          page: String(state.page),
          pageSize: String(state.pageSize),
          search: state.search
        });

        try {
          const response = await fetch(`/api/users?${params}`);
          if (!response.ok) throw new Error("Request failed");
          const result = await response.json();
          render(result.users, result.pagination);
        } catch (_error) {
          usersBody.replaceChildren();
          empty.hidden = true;
          error.hidden = false;
          meta.textContent = "Помилка завантаження";
        }
      }

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        state.search = searchInput.value.trim();
        state.page = 1;
        void loadUsers();
      });

      previous.addEventListener("click", () => {
        if (state.page > 1) {
          state.page -= 1;
          void loadUsers();
        }
      });

      next.addEventListener("click", () => {
        state.page += 1;
        void loadUsers();
      });

      void loadUsers();
    </script>
  </body>
</html>
